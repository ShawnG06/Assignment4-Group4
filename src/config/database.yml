default: &default
  adapter: postgresql
  encoding: unicode

  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>

  username: <%= ENV.fetch("DB_USER", "stock_app") %>
  password: <%= ENV["DB_PASSWORD"] %>

  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "stock_trading_a4") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "stock_trading_a4_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
